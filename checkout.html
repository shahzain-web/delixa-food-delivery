<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Delixa</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================
        CHECKOUT SECTION
========================== -->

<section class="checkout-section">

    <div class="container">

        <!-- Title -->

        <div class="checkout-title text-center mb-5">

            <span>
                <i class="fas fa-shopping-cart"></i>
                Secure Checkout
            </span>

            <h2>Complete Your Order</h2>

            <p>
                Fill in your details to place your delicious order.
            </p>

        </div>

        <div class="row g-4">

            <!-- ==========================
                 CUSTOMER INFORMATION
            ========================== -->

            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="mb-4">

                        Customer Information

                    </h3>

                    <form id="checkoutForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Full Name"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Email Address"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="Phone Number"
                                required>

                        </div>

                        <div class="mb-3">

                            <input
                                type="text"
                                class="form-control"
                                placeholder="City"
                                required>

                        </div>

                        <div class="mb-3">

                            <textarea
                                class="form-control"
                                rows="5"
                                placeholder="Full Delivery Address"
                                required></textarea>

                        </div>

                        <h5 class="mt-4 mb-3">

                            Payment Method

                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        checked>

                                    Cash on Delivery

                                </label>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment">

                                    JazzCash

                                </label>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment">

                                    EasyPaisa

                                </label>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment">

                                    Debit / Credit Card

                                </label>

                            </div>

                        </div>

                    </form>

                </div>

            </div>
                        <!-- ==========================
                 ORDER SUMMARY
            ========================== -->

            <div class="col-lg-5">

                <div class="order-summary">

                    <h3 class="summary-title">

                        <i class="fas fa-shopping-bag"></i>

                        Order Summary

                    </h3>

                    <!-- Cart Products -->

                    <div id="checkoutItems">

                        <!-- JavaScript yahan products show karegi -->

                    </div>

                    <hr>

                    <!-- Price Details -->

                    <div class="summary-row">

                        <span>Subtotal</span>

                        <span id="subtotal">Rs. 0</span>

                    </div>

                    <div class="summary-row">

                        <span>Delivery Fee</span>

                        <span>Rs. 150</span>

                    </div>

                    <div class="summary-row">

                        <span>Tax (5%)</span>

                        <span id="tax">Rs. 0</span>

                    </div>

                    <hr>

                    <div class="summary-total">

                        <span>Total</span>

                        <span id="grandTotal">Rs. 0</span>

                    </div>

                    <button
                        id="placeOrder"
                        class="place-order-btn w-100">

                        <i class="fas fa-check-circle"></i>

                        Place Order

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>
    <!-- ==========================
         Bootstrap JS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
